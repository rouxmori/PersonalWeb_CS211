<!DOCTYPE html>
<html>
<head>
<title>Character Counter</title>
<style>
	h1 {
		text-align: center;
	}
	body {
		display: flex;
		flex-direction: column;
		align-items: center;
		min-height: 100vh;
		margin: 0;
	}
	#textcontent {
		height: 40px;
		width: 400px;
		font-size: 16px;
	}
	#preview {
		margin-top: 20px;
		width: 400px;
		min-height: 60px;
		padding: 10px;
		border: 1px solid #ccc;
		border-radius: 6px;
		font-size: 16px;
		word-wrap: break-word;
	}
	#frequency {
		margin-top: 20px;
		width: 400px;
		min-height: 60px;
		padding: 10px;
		border: 1px solid #ccc;
		border-radius: 6px;
		font-size: 14px;
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}
	.freq-item {
		background: #f0f0f0;
		padding: 4px 8px;
		border-radius: 4px;
	}
	#preview-label,
	#counter {
		width: 400px;
		margin-top: 20px;
		margin-bottom: 0;
	}
</style>
</head>
<body>

<h1>Live Character Counter</h1>

<div class="textfield">
	<form>
		<label for="textcontent">Enter your text here:</label><br>
		<input type="text" id="textcontent" name="textcontent" maxlength="150">
		<p><span id="charCount">0</span>/150</p>
	</form>
</div>

<p id="preview-label">Live Preview:</p>
<div id="preview"></div>

<p id="counter">Character Counter:</p>
<div id="frequency"></div>

<script>
	const textField = document.getElementById('textcontent');
	const charCount = document.getElementById('charCount');
	const preview = document.getElementById('preview');
	const frequency = document.getElementById('frequency');

	const validChars = 'abcdefghijklmnopqrstuvwxyz012345'.split('');

	function updateFrequencyDisplay(counts) {
		frequency.innerHTML = '';
		for (const char of validChars) {
			const span = document.createElement('span');
			span.className = 'freq-item';
			span.innerHTML = `<strong>${char.toUpperCase()}</strong>: ${counts[char] || 0}`;
			frequency.appendChild(span);
		}
	}

	textField.addEventListener('input', () => {
		const value = textField.value;
		charCount.textContent = value.length;
		preview.textContent = value;

		const counts = {};
		for (const char of value.toLowerCase()) {
			if (validChars.includes(char)) {
				counts[char] = (counts[char] || 0) + 1;
			}
		}

		updateFrequencyDisplay(counts);
	});

	updateFrequencyDisplay({});
</script>

</body>
</html>
