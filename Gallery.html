<script>
    (() => {
    // every picture that should open in the viewer
    const PHOTOS = ".gallery-item img, .mygallery img, .friendgallery img, .gallery-grid img";

    // uses the <dialog id="viewer"> from the HTML if it exists, otherwise creates it
    function getViewer() {
        let viewer = document.getElementById("viewer");
        if (!viewer) {
            viewer = document.createElement("dialog");
            viewer.id = "viewer";
            viewer.setAttribute("aria-label", "Photo viewer");
            viewer.innerHTML = `
                <button class="viewer-btn viewer-close" aria-label="Close">&times;</button>
                <button class="viewer-btn viewer-prev" aria-label="Previous photo">&#129032;</button>
                <figure><img alt=""><figcaption></figcaption></figure>
                <button class="viewer-btn viewer-next" aria-label="Next photo">&#129034;</button>`;
            document.body.append(viewer);
        }
        return viewer;
    }

    function init() {
        const viewer        = getViewer();
        const viewerImg     = viewer.querySelector("img");
        const viewerCaption = viewer.querySelector("figcaption");
        let group = [];   // the pictures of the gallery that was clicked, so prev/next stays inside it
        let index = 0;

        function show(n) {
            index = (n + group.length) % group.length;     // wraps at both ends
            const img = group[index];
            viewerImg.src = img.dataset.full || img.currentSrc || img.src;
            viewerImg.alt = img.alt;
            viewerCaption.textContent = img.closest("figure")?.querySelector("figcaption")?.textContent ?? img.alt;
        }

        function openViewer(img) {
            const gallery = img.closest(".mygallery, .friendgallery, .gallery-grid") || img.closest(".gallery") || document;
            group = [...gallery.querySelectorAll(PHOTOS)].filter(p => !p.closest("#viewer"));
            show(group.indexOf(img));
            viewer.showModal();                            // Esc closes it automatically
        }

        // make the pictures reachable with the keyboard
        const photos = [...document.querySelectorAll(PHOTOS)].filter(p => !p.closest("#viewer"));
        photos.forEach(img => { img.tabIndex = 0; img.setAttribute("role", "button"); });

        // one listener for all pictures (also works for pictures added later)
        document.addEventListener("click", event => {
            const img = event.target.closest(PHOTOS);
            if (!img || img.closest("#viewer")) return;
            event.preventDefault();                        // in case the picture sits inside a link
            openViewer(img);
        });

        document.addEventListener("keydown", event => {
            const img = document.activeElement;
            if (img?.matches?.(PHOTOS) && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                openViewer(img);
            }
        });

        viewer.querySelector(".viewer-prev").addEventListener("click", () => show(index - 1));
        viewer.querySelector(".viewer-next").addEventListener("click", () => show(index + 1));
        viewer.querySelector(".viewer-close").addEventListener("click", () => viewer.close());

        // clicking the dark area outside the picture closes it
        viewer.addEventListener("click", event => {
            if (event.target === viewer) viewer.close();
        });

        viewer.addEventListener("keydown", event => {
            if (event.key === "ArrowLeft")  show(index - 1);
            if (event.key === "ArrowRight") show(index + 1);
        });

        console.info(`Photo viewer ready: ${photos.length} photos found`);
    }

    // run once the page has been read, wherever the script tag is placed
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
})();
</script>
